; The Renegades loader's own texts in English (Renegades.exe). Renegades' briefings, story and credits come from its
; own files, not from here.
;
; To translate: copy this file to lang.<code>.ini beside it (lang.de.ini), set Code below, translate the quoted texts,
; and set Lang=<code> in Renegades.ini. Keep each key; a key left out shows the English text.
; %s and %i are filled in, in order (%% is a %); \n starts a new line; & marks a button's key (&Quit: Alt+Q).
; Save the file as UTF-8.


; Die Texte des Renegades-Loaders auf Deutsch (Renegades.exe). Mit Lang=de in Renegades.ini.
; The Renegades loader's own texts in German. Renegades' briefings, story and credits come from its own files and stay
; in English.
;
; Translated from lang.en.ini: the same keys; %s and %i are filled in, in order; \n starts a new line; & marks a
; button's key, and it must be a plain letter (A-Z), not an umlaut. Save the file as UTF-8.


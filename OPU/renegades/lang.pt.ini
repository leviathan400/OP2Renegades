; Os textos do loader do Renegades em português (Renegades.exe). Com Lang=pt em Renegades.ini.
; The Renegades loader's own texts in Portuguese (Brazilian spelling). Renegades' briefings, story and credits come
; from its own files and stay in English.
;
; Translated from lang.en.ini: the same keys; %s and %i are filled in, in order; \n starts a new line; & marks a
; button's key, and it must be a plain letter (A-Z), not an accented one. Save the file as UTF-8.


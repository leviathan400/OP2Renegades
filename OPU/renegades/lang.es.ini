; Los textos del loader de Renegades en español (Renegades.exe). Con Lang=es en Renegades.ini, o en Preferencias.
; The Renegades loader's own texts in Spanish. Renegades' briefings, story and credits come from its own files and
; stay in English.
;
; Translated from lang.en.ini: the same keys; %s and %i are filled in, in order; \n starts a new line; & marks a
; button's key, and it must be a plain letter (A-Z), not an accented one. Save the file as UTF-8.

